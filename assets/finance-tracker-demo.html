<script>

const CATS = [

const catByName = (name) => CATS.find((c) => c.name === name);
const colorForCategory = (name) => catByName(name)?.color ?? "#111111";

function hexToHsl(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let l = (max+min)/2, s = 0, hue = 0;
  if (max !== min) {
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if (max === r) hue = (g-b)/d + (g < b ? 6 : 0);
    else if (max === g) hue = (b-r)/d + 2;
    else hue = (r-g)/d + 4;
    hue *= 60;
  }
  return { h: hue, s: s*100, l: l*100 };
}
function hslToHex(h, s, l) {
  const sN = s/100, lN = l/100;
  const c = (1-Math.abs(2*lN-1))*sN;
  const hP = ((h%360)+360)%360/60;
  const x = c*(1-Math.abs(hP%2-1));
  let r1=0,g1=0,b1=0;
  if (hP<1) [r1,g1,b1]=[c,x,0]; else if (hP<2) [r1,g1,b1]=[x,c,0]; else if (hP<3) [r1,g1,b1]=[0,c,x];
  else if (hP<4) [r1,g1,b1]=[0,x,c]; else if (hP<5) [r1,g1,b1]=[x,0,c]; else [r1,g1,b1]=[c,0,x];
  const m = lN - c/2;
  const toHex = (v) => Math.round((v+m)*255).toString(16).padStart(2,"0");
  return `#${toHex(r1)}${toHex(g1)}${toHex(b1)}`.toUpperCase();
}
function colorForSubcategory(parentName, siblingIndex) {
  const { h, s, l } = hexToHsl(colorForCategory(parentName));
  const delta = (Math.floor(siblingIndex/2)+1)*9;
  const sign = siblingIndex%2===0 ? 1 : -1;
  const newL = Math.min(85, Math.max(15, l + sign*delta));
  return hslToHex(h, s, newL);
}
const fg = (hex) => {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  const f = (c) => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return (0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b)) > 0.42 ? "#000" : "#fff";
};
const short = (n) => "$" + Math.round(n).toLocaleString("en-US");
const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneySigned = (n, tier) => (tier !== "Purchase" ? "+" : "") + money(n);

function pad2(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function ym(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
function fmtDayMonth(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function monthLabel(ymStr) {
  const [y,m] = ymStr.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
}
function bucketLabel(bucket, granularity) {
  if (granularity === "month") {
    const [y,m] = bucket.split("-").map(Number);
    return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"short"});
  }
  const [y,m,d] = bucket.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

// deterministic PRNG so the demo dataset is stable across reloads
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1337);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

let nextId = 1;
const ledger = []; // categorized Purchase-tier transactions: {id,date,desc,amt,cat,sub,shared}

const TODAY = new Date();
const START = new Date(TODAY.getFullYear(), TODAY.getMonth() - 7, TODAY.getDate());

for (let d = new Date(START); d <= TODAY; d.setDate(d.getDate() + 1)) {
  const date = ymd(d);
  const dom = d.getDate();

  // rent & bills: monthly lump-sum bills spread across the month
  if (dom === 1) push("Rent & Bills", "Rent", "Greystar Rent", 1450 + rng() * 40);
  if (dom === 5) push("Rent & Bills", "Phone", "Verizon Wireless", 85 + rng() * 20);
  if (dom === 8) push("Rent & Bills", "Electricity", "ConEd Electric", 60 + rng() * 90);
  if (dom === 15) push("Rent & Bills", "Gas", "National Grid Gas", 35 + rng() * 60);
  if (dom === 22) push("Rent & Bills", "Internet", "Spectrum Internet", 70 + rng() * 10);

  maybe("Food & Drinks", 0.55, 8, 45);
  maybe("Groceries", 0.32, 20, 95);
  maybe("Shopping", 0.18, 15, 160);
  maybe("Home", 0.09, 20, 170);
  maybe("Car", 0.11, 15, 95);
  maybe("Fun", 0.22, 10, 75);
  maybe("Transportation", 0.35, 5, 32);
  maybe("Travel", 0.02, 180, 950);
  maybe("Other", 0.14, 5, 60);

  function maybe(name, prob, lo, hi) {
    if (rng() < prob) {
      const cat = catByName(name);
      push(name, pick(cat.subs), pick(cat.merchants), lo + rng() * (hi - lo));
    }
  }
  function push(name, sub, merchant, amt) {
    ledger.push({
      id: "h" + nextId++,
      date,
      desc: merchant,
      amt: Math.round(amt * 100) / 100,
      cat: name,
      sub,
      shared: rng() < 0.08,
    });
  }
}

// A handful of fresh, still-uncategorized transactions to seed the Inbox —
// the last couple of days' worth, exactly like a real bank feed sync would.
function daysAgo(n) { const d = new Date(TODAY); d.setDate(d.getDate() - n); return ymd(d); }
const pending = [

  { id: "p2", date: daysAgo(0), desc: "UBER TRIP 8842", amt: 18.40, tier: "Purchase" },
  { id: "p3", date: daysAgo(1), desc: "AMAZON MKTPLACE", amt: 34.99, tier: "Purchase" },
  { id: "p4", date: daysAgo(1), desc: "SHAKE SHACK #4021", amt: 22.30, tier: "Purchase" },
  { id: "p5", date: daysAgo(2), desc: "TRADER JOE'S #112", amt: 52.10, tier: "Purchase",
    rule: 'Rule "trader joe" → Groceries · Trader Joes', ruleCat: "Groceries", ruleSub: "Trader Joes" },
  { id: "p6", date: daysAgo(2), desc: "NETFLIX.COM", amt: 15.49, tier: "Purchase",
    rule: 'Rule "netflix" → Fun · Subscriptions', ruleCat: "Fun", ruleSub: "Subscriptions" },
  { id: "p7", date: daysAgo(1), desc: "PAYCHECK ACME CORP", amt: 2400, tier: "Income",
    rule: 'Rule "paycheck" → Income', ruleTier: "Income" },
  { id: "p8", date: daysAgo(0), desc: "VANGUARD BUY VTI", amt: 500, tier: "Investment" },
];

const netWorth = { checking: 8342.10, cardsOwed: 2140.55, hayatBalance: 180.00 };

/* ============================== DERIVED QUERIES ============================== */

function allPurchaseAmounts(catFilter) {
  // Mirrors /api/summary logic: "All" (no filter) counts every Purchase-tier
  // transaction including still-uncategorized ones; a category filter only
  // matches categorized rows.
  const rows = ledger.map((t) => ({ date: t.date, amt: t.amt, cat: t.cat }));
  const pendingPurchase = pending.filter((t) => t.tier === "Purchase").map((t) => ({ date: t.date, amt: t.amt, cat: null }));
  return rows.concat(pendingPurchase).filter((r) => !catFilter || r.cat === catFilter);
}

function monthSummary() {
  const dayOfMonth = TODAY.getDate();
  const daysInCurrentMonth = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate();
  const monthStart = ymd(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const todayStr = ymd(TODAY);
  const all = allPurchaseAmounts(null);
  const thisMonth = all.filter((r) => r.date >= monthStart && r.date <= todayStr).reduce((s, r) => s + r.amt, 0);

  const priorSums = [];
  for (let i = 1; i <= 3; i++) {
    let ty = TODAY.getFullYear(), tm = TODAY.getMonth() - i;
    while (tm < 0) { tm += 12; ty -= 1; }
    const daysInThat = new Date(ty, tm + 1, 0).getDate();
    const equivDay = Math.min(daysInThat, Math.max(1, Math.round((dayOfMonth / daysInCurrentMonth) * daysInThat)));
    const start = ymd(new Date(ty, tm, 1)), end = ymd(new Date(ty, tm, equivDay));
    const rows = all.filter((r) => r.date >= start && r.date <= end);
    if (rows.length) priorSums.push(rows.reduce((s, r) => s + r.amt, 0));
  }
  const average = priorSums.length ? priorSums.reduce((a, b) => a + b, 0) / priorSums.length : thisMonth;
  const projected = average > 0 ? average * (daysInCurrentMonth / dayOfMonth) : 0;
  const fillPct = projected > 0 ? Math.min(100, Math.max(0, (thisMonth / projected) * 100)) : 0;
  const todayPct = (dayOfMonth / daysInCurrentMonth) * 100;
  const diffPct = average > 0 ? ((thisMonth - average) / average) * 100 : 0;
  const paceLabel = diffPct <= -10 ? "Under pace" : diffPct >= 10 ? "Over pace" : "Regular pace";
  return { thisMonth, fillPct, todayPct, dayOfMonth, daysInMonth: daysInCurrentMonth, paceLabel };
}

function categoriesSummary(monthYm) {
  const result = {};
  ledger.filter((t) => t.date.slice(0, 7) === monthYm).forEach((t) => {
    result[t.cat] = (result[t.cat] || 0) + t.amt;
  });
  return result;
}

function drillList(monthYm, catName) {
  return ledger
    .filter((t) => t.date.slice(0, 7) === monthYm && t.cat === catName)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

function mondayOf(d) {
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
}
function bucketListFor(months, granularity) {
  const buckets = [];
  if (granularity === "month") {
    const start = new Date(TODAY.getFullYear(), TODAY.getMonth() - (months - 1), 1);
    for (const d = new Date(start); d <= TODAY; d.setMonth(d.getMonth() + 1)) buckets.push(ym(d));
  } else if (granularity === "week") {
    const cutoff = new Date(TODAY.getFullYear(), TODAY.getMonth() - months, TODAY.getDate());
    for (let d = mondayOf(cutoff), last = mondayOf(TODAY); d <= last; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7)) buckets.push(ymd(d));
  } else {
    const cutoff = new Date(TODAY.getFullYear(), TODAY.getMonth() - months, TODAY.getDate());
    for (let d = cutoff; ymd(d) <= ymd(TODAY); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) buckets.push(ymd(d));
  }
  return buckets;
}
function daysInBucket(bucket, granularity) {
  if (granularity === "day") return [bucket];
  if (granularity === "week") {
    const [y, m, d] = bucket.split("-").map(Number);
    const start = new Date(y, m - 1, d);
    return Array.from({ length: 7 }, (_, i) => ymd(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i)));
  }
  const [y, m] = bucket.split("-").map(Number);
  const days = new Date(y, m, 0).getDate();
  return Array.from({ length: days }, (_, i) => ymd(new Date(y, m - 1, i + 1)));
}
function trendSeries(catName, months, granularity) {
  const rows = allPurchaseAmounts(catName);
  const byDay = new Map();
  rows.forEach((r) => byDay.set(r.date, (byDay.get(r.date) || 0) + r.amt));
  return bucketListFor(months, granularity).map((bucket) => ({
    bucket,
    total: daysInBucket(bucket, granularity).reduce((s, d) => s + (byDay.get(d) || 0), 0),
  }));
}

function pieSlices(data, r, cx, cy, sel, pull) {
  const total = Object.values(data).reduce((a, b) => a + b, 0);
  let a0 = -Math.PI / 2;
  const out = [];
  Object.keys(data).forEach((k) => {
    const frac = total > 0 ? data[k] / total : 0;
    const a1 = a0 + frac * Math.PI * 2;
    const mid = (a0 + a1) / 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const off = pull && sel === k ? 11 + (1 - frac) * 9 : 0;
    out.push({
      name: k, amount: data[k], frac,
      color: colorForCategory(k),
      d: `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`,
      tf: `translate(${(off * Math.cos(mid)).toFixed(2)} ${(off * Math.sin(mid)).toFixed(2)})`,
      sw: sel === k ? 4 : 2,
    });
    a0 = a1;
  });
  return { out, total };
}
function pieSvg(data, { r, cx, cy, size, selected = null, interactive = false, onSelectAttr = "" }) {
  const { out } = pieSlices(data, r, cx, cy, selected, interactive);
  const vb = cx * 2;
  const paths = out.map((s) => `<path d="${s.d}" fill="${s.color}" stroke="#000" stroke-width="${interactive ? 1 : 2}"
    transform="${interactive ? s.tf : ""}" style="transition:transform .18s ease; ${interactive ? "cursor:pointer" : ""}"
    ${interactive ? `onclick="${onSelectAttr.replace("__NAME__", s.name)}"` : ""}></path>`).join("");
  return `<svg viewBox="0 0 ${vb} ${vb}" style="width:${size}px;height:${size}px;flex-shrink:0;">${paths}</svg>`;
}

// Report hovers over specifically-tagged [data-region] elements to the
// parent page, which shows a callout beside the phone explaining that
// element. Delegated on document so it survives render() rebuilding the
// screen's DOM — no listeners to reattach after every re-render.
(function () {
  let current = null;
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest("[data-region]");
    if (!el || el === current) return;
    current = el;
    const r = el.getBoundingClientRect();
    try {
      window.parent.postMessage({
        source: "finance-tracker", type: "demo-region", region: el.dataset.region,
        rect: { left: r.left, top: r.top, width: r.width, height: r.height }
      }, "*");
    } catch (e) {}
  });
  document.addEventListener("mouseout", (e) => {
    if (!current) return;
    if (current.contains(e.relatedTarget)) return;
    current = null;
    try { window.parent.postMessage({ source: "finance-tracker", type: "demo-region-end" }, "*"); } catch (e) {}
  });
})();

/* ---- Inbox ---- */
function inboxDraft(id) {
  if (!S.inboxDraft[id]) S.inboxDraft[id] = { tier: "Purchase", cat: null, sub: null, shared: false };
  return S.inboxDraft[id];
}
function toggleInboxRow(id) {
  S.inboxOpenId = S.inboxOpenId === id ? null : id;
  if (S.inboxOpenId) {
    const t = pending.find((p) => p.id === id);
    S.inboxDraft[id] = { tier: t.ruleTier || "Purchase", cat: t.ruleCat || null, sub: t.ruleSub || null, shared: false };
  }
  render();
}
window.toggleInboxRow = toggleInboxRow;
function setDraft(id, patch) { Object.assign(inboxDraft(id), patch); render(); }
window.setDraft = setDraft;

function finalizeInbox(id, { tier, cat, sub, shared }) {
  const idx = pending.findIndex((p) => p.id === id);
  const t = pending[idx];
  if (tier === "Purchase" && cat) {
    ledger.push({ id: "h" + nextId++, date: t.date, desc: t.desc, amt: t.amt, cat, sub, shared: !!shared });
  }
  pending.splice(idx, 1);
  S.inboxOpenId = null;
  render();
}
window.finalizeInbox = finalizeInbox;

function confirmAllMatched() {
  [...pending].forEach((t) => {
    if (t.ruleCat) finalizeInboxSilent(t.id, { tier: "Purchase", cat: t.ruleCat, sub: t.ruleSub || null, shared: false });
    else if (t.ruleTier) removePendingSilent(t.id);
  });
  render();
}
function finalizeInboxSilent(id, opts) {
  const idx = pending.findIndex((p) => p.id === id);
  const t = pending[idx];
  ledger.push({ id: "h" + nextId++, date: t.date, desc: t.desc, amt: t.amt, cat: opts.cat, sub: opts.sub, shared: false });
  pending.splice(idx, 1);
}
function removePendingSilent(id) {
  const idx = pending.findIndex((p) => p.id === id);
  if (idx >= 0) pending.splice(idx, 1);
}
window.confirmAllMatched = confirmAllMatched;

function inboxRow(t, matched) {
  const open = S.inboxOpenId === t.id;
  const d = open ? inboxDraft(t.id) : null;
  const done = open && d.tier === "Purchase" && d.cat ? colorForCategory(d.cat) : null;
  const btnBg = done || (open ? "#000" : "#fff");
  const btnFg = done ? fg(done) : open ? "#fff" : "#000";

  let body = "";
  if (open) {
    const tiers = ["Income", "Purchase", "Investment"];
    body += `<div style="margin-top:14px;background:#f5f4f1;padding:16px;">
      <div class="uc" style="margin-bottom:8px;font:700 9.5px 'Space Mono',monospace;letter-spacing:.18em;color:rgba(0,0,0,.62);">Type</div>
      <div style="display:flex;border:2px solid #000;margin-bottom:22px;">
        ${tiers.map((tr, i) => `
          <div onclick="setDraft('${t.id}',{tier:'${tr}',cat:null,sub:null})" class="uc"
            style="flex:1;display:grid;place-items:center;min-height:44px;cursor:pointer;
            background:${d.tier === tr ? "#000" : "#fff"};color:${d.tier === tr ? "#fff" : "#000"};
            border-left:${i ? "2px solid #000" : "none"};font:800 12px Archivo;letter-spacing:.06em;">${tr}</div>`).join("")}
      </div>`;

    if (d.tier !== "Purchase") {
      body += `<button onclick="finalizeInbox('${t.id}',{tier:'${d.tier}'})" class="uc"
        style="width:100%;display:grid;place-items:center;height:46px;background:#000;color:#fff;font:800 12px Archivo;letter-spacing:.06em;">Done</button>`;
    } else {
      body += `<div class="uc" style="margin-bottom:8px;font:700 9.5px 'Space Mono',monospace;letter-spacing:.18em;color:rgba(0,0,0,.62);">Category</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${CATS.map((c) => `<div onclick="setDraft('${t.id}',{cat:'${c.name}',sub:null})" class="chip md ${d.cat === c.name ? "active" : ""}"

          <span class="dot" style="background:${d.cat === c.name ? fg(c.color) : c.color};"></span>${c.name}</div>`).join("")}
      </div>`;

      if (d.cat && d.cat !== "Other") {
        const subs = catByName(d.cat).subs;
        body += `<div style="margin-top:20px;">
          <div class="uc" style="margin-bottom:8px;font:400 9.5px 'Space Mono',monospace;letter-spacing:.12em;color:rgba(0,0,0,.62);">Subcategory</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${subs.map((n, i) => {
              const active = d.sub === n;
              const c = colorForSubcategory(d.cat, i);
              return `<div onclick="setDraft('${t.id}',{sub:'${active ? "" : n}'})" style="min-height:34px;padding:0 11px;display:grid;place-items:center;cursor:pointer;
                border:1.5px solid ${active ? "#000" : "rgba(0,0,0,.22)"};background:${active ? c : "transparent"};color:${active ? fg(c) : "#2d2b2b"};font:500 13px Archivo;">${n}</div>`;
            }).join("")}
          </div>
        </div>`;
      }

      if (d.cat) {
        body += `<div style="margin-top:22px;padding-top:16px;border-top:1.5px solid rgba(0,0,0,.2);">
          <div onclick="setDraft('${t.id}',{shared:${!d.shared}})" style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:16px;">
            <div style="width:18px;height:18px;border:2px solid #000;background:${d.shared ? "#17BEBB" : "#fff"};flex-shrink:0;"></div>
            <span class="uc" style="font:700 11px Archivo;letter-spacing:.06em;">Shared 50/50 with Hayat</span>
          </div>
          <button onclick='finalizeInbox("${t.id}",{tier:"Purchase",cat:"${d.cat}",sub:${d.sub ? `"${d.sub}"` : "null"},shared:${d.shared}})'
            class="uc" style="width:100%;display:grid;place-items:center;height:48px;background:#000;color:#fff;font:800 13px Archivo;letter-spacing:.1em;">Save</button>
        </div>`;
      }
    }
    body += `</div>`;
  }

  const suggestion = matched && !open
    ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
        ${t.ruleCat
          ? `<span class="chip md active" style="background:${colorForCategory(t.ruleCat)};color:${fg(colorForCategory(t.ruleCat))};border-color:#000;">
              <span class="dot" style="background:${fg(colorForCategory(t.ruleCat))}"></span>${t.ruleSub || t.ruleCat}</span>`
          : `<span class="uc" style="border:1.5px solid #000;padding:3px 8px;font:700 11px Archivo;letter-spacing:.06em;">${t.ruleTier}</span>`}
        <span style="font:400 10.5px Archivo;color:rgba(0,0,0,.45);">${t.rule}</span>
      </div>`
    : "";

  return `<div data-region="inbox-label" style="border-top:2px solid #000;padding:14px 0;">
    <div style="display:flex;align-items:flex-start;gap:12px;">
      <div style="min-width:0;flex:1;">
        <div class="uc" style="margin-bottom:4px;font:400 9.5px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(0,0,0,.62);">${fmtDayMonth(t.date)}</div>
        <div style="font:700 15px/1.25 Archivo;letter-spacing:-.01em;">${t.desc}</div>
        ${suggestion}
      </div>
      <div style="flex:none;text-align:right;">
        <div style="font:800 19px Archivo;font-variant-numeric:tabular-nums;letter-spacing:-.02em;">${moneySigned(t.amt, t.tier)}</div>
        <button onclick="toggleInboxRow('${t.id}')" class="uc" style="margin-top:9px;display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 13px;border:2px solid #000;background:${btnBg};color:${btnFg};font:800 11.5px Archivo;letter-spacing:.08em;">
          ${open ? "Close" : matched ? "Edit" : "Label"}
        </button>
      </div>
    </div>
    ${body}
  </div>`;
}

function renderInbox() {
  const isMatched = (t) => !!t.rule && (!!t.ruleCat || !!t.ruleTier);
  const pend = pending.filter((t) => !isMatched(t));
  const matched = pending.filter(isMatched);

  return `<div style="padding:18px 22px 26px;">
    <div class="uc" style="font:900 30px/1 Archivo;letter-spacing:-.03em;">Inbox</div>
    <div data-region="inbox-rows" style="margin-top:5px;margin-bottom:8px;font:500 12.5px Archivo;color:rgba(0,0,0,.6);">${pending.length} uncategorized</div>

    ${pend.map((t) => inboxRow(t, false)).join("")}
    ${pending.length === 0
      ? `<div style="padding:48px 0;text-align:center;font:500 13px Archivo;color:rgba(0,0,0,.45);">Nothing left to label.</div>`
      : matched.length > 0
        ? `<div style="height:2px;background:#000;"></div>
           <div data-region="inbox-rules" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
             <div style="font:500 12px Archivo;color:rgba(0,0,0,.5);">Rules matched ${matched.length} of these.</div>

           </div>
           <div style="margin-top:8px;">${matched.map((t) => inboxRow(t, true)).join("")}</div>`
        : ""}
  </div>`;
}

/* ---- Categories ---- */
function availableMonths() {
  const set = new Set(ledger.map((t) => t.date.slice(0, 7)));
  return [...set].sort().reverse();
}
function setCategoriesMonth(m) { S.categoriesMonth = m; S.categoriesSel = null; S.categoriesEditId = null; render(); }
window.setCategoriesMonth = setCategoriesMonth;
function toggleCategoriesSel(name) {
  S.categoriesSel = S.categoriesSel === name ? null : name;
  S.categoriesEditId = null;
  render();
}
window.toggleCategoriesSel = toggleCategoriesSel;
function toggleDrillEdit(id) {
  const wasOpen = S.categoriesEditId === id;
  S.categoriesEditId = wasOpen ? null : id;
  if (!wasOpen) {
    const t = ledger.find((h) => h.id === id);
    S.drillDraft = S.drillDraft || {};
    S.drillDraft[id] = { cat: t.cat, shared: t.shared };

}
window.toggleDrillEdit = toggleDrillEdit;

  t.shared = newShared;
  S.categoriesEditId = null;
  render();
}
window.saveDrillEdit = saveDrillEdit;
function setDrillEditField(id, patch) {

  render();
}
window.setDrillEditField = setDrillEditField;

        <div style="font:900 34px/1 Archivo;letter-spacing:-.03em;font-variant-numeric:tabular-nums;">${short(selSlice ? selSlice.amount : total)}</div>

  }

  return `<div>

        <div style="margin-top:7px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
          <span style="background:${tagBg};color:${fg(tagBg)};border:1.5px solid #000;padding:2px 7px;font:700 11px Archivo;">${item.sub || item.cat}</span>
          ${item.shared ? `<span style="background:#fcba03;border:1.5px solid #000;padding:2px 7px;font:700 11px Archivo;">Hayat 50/50</span>` : ""}
          <span class="uc" style="font:400 9.5px 'Space Mono',monospace;letter-spacing:.12em;color:rgba(0,0,0,.62);">${fmtDayMonth(item.date)}</span>
        </div>
      </div>
      <div style="flex:none;text-align:right;">
        <div style="font:800 15.5px Archivo;font-variant-numeric:tabular-nums;">${money(item.amt)}</div>
        <button onclick="toggleDrillEdit('${item.id}')" class="uc" style="margin-top:6px;font:700 11px Archivo;letter-spacing:.08em;text-decoration:underline;background:none;">${editing ? "Cancel" : "Edit"}</button>
      </div>
    </div>
    ${body}
  </div>`;
}

/* ---- Analysis ---- */
function toggleAnalysisCat(name) {
  S.analysisHover = null;
  if (S.analysisSelected.has(name)) S.analysisSelected.delete(name); else S.analysisSelected.add(name);
  render();
}
window.toggleAnalysisCat = toggleAnalysisCat;
function setAnalysisRange(v) { S.analysisRange = v; S.analysisHover = null; render(); }
window.setAnalysisRange = setAnalysisRange;
function setAnalysisGranularity(v) { S.analysisGranularity = v; S.analysisHover = null; render(); }
window.setAnalysisGranularity = setAnalysisGranularity;

function activeAnalysisSeries() {
  const list = [];
  if (S.analysisSelected.has(ALL_KEY)) list.push({ key: ALL_KEY, color: ALL_COLOR, category: null });
  CATS.forEach((c) => { if (S.analysisSelected.has(c.name)) list.push({ key: c.name, color: c.color, category: c.name }); });
  return list;
}

function renderAnalysis() {
  const defs = activeAnalysisSeries();
  const seriesData = defs.map((def) => ({ key: def.key, color: def.color, points: trendSeries(def.category, S.analysisRange, S.analysisGranularity) }));
  const anyPoints = seriesData[0]?.points ?? [];
  const idx = S.analysisHover ?? anyPoints.length - 1;
  const dateLabel = anyPoints[idx] ? bucketLabel(anyPoints[idx].bucket, S.analysisGranularity) : (defs.length ? "" : "No categories selected");

  const segRange = [3, 6, 12].map((m, i) =>
    `<button class="seg-btn ${S.analysisRange === m ? "active" : ""}" onclick="setAnalysisRange(${m})">${m}M</button>`).join("");
  const segGran = [["month","M"],["week","W"],["day","D"]].map(([v,l]) =>
    `<button class="seg-btn ${S.analysisGranularity === v ? "active" : ""}" onclick="setAnalysisGranularity('${v}')">${l}</button>`).join("");

  return `<div style="padding:18px 22px 26px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
      <div class="uc" style="font:900 30px/1 Archivo;letter-spacing:-.03em;">Analysis</div>
      <div data-region="analysis-controls" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <div class="seg-group">${segGran}</div>
        <div class="seg-group">${segRange}</div>
      </div>
    </div>

    <div style="border:2px solid #000;padding:14px 16px;margin-bottom:14px;">
      <div class="uc" style="margin-bottom:8px;font:700 10px 'Space Mono',monospace;letter-spacing:.16em;color:rgba(0,0,0,.55);">${dateLabel}</div>
      ${defs.length === 0
        ? `<div style="font:600 13px Archivo;color:rgba(0,0,0,.5);">Pick a category below to plot its trend.</div>`
        : defs.map((def) => {
            const sd = seriesData.find((s) => s.key === def.key);
            const val = sd?.points[idx]?.total ?? 0;
            return `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
              <span style="width:11px;height:11px;flex-shrink:0;background:${def.color};border:1.5px solid #000;"></span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px Archivo;">${def.key === ALL_KEY ? "All spending" : def.key}</span>
              <span style="font:800 15px Archivo;font-variant-numeric:tabular-nums;">${short(val)}</span>
            </div>`;
          }).join("")}
    </div>

    <div data-region="analysis-chart" style="border:2px solid #000;background:#fff;margin-bottom:22px;padding-bottom:14px;">
      <svg id="analysisChart" viewBox="0 0 346 190" style="width:100%;height:190px;display:block;"></svg>
    </div>

    <div class="eyebrow" style="margin-bottom:8px;">By category</div>
    <div data-region="analysis-categories" style="display:flex;flex-wrap:wrap;gap:6px;">
      <div onclick="toggleAnalysisCat('${ALL_KEY}')" class="chip ${S.analysisSelected.has(ALL_KEY) ? "active" : ""}"
        style="${S.analysisSelected.has(ALL_KEY) ? `background:${ALL_COLOR};color:${fg(ALL_COLOR)};border-color:#000;` : ""}">
        <span class="dot" style="background:${S.analysisSelected.has(ALL_KEY) ? fg(ALL_COLOR) : ALL_COLOR};"></span>All</div>
      ${CATS.map((c) => `<div onclick="toggleAnalysisCat('${c.name}')" class="chip ${S.analysisSelected.has(c.name) ? "active" : ""}"
        style="${S.analysisSelected.has(c.name) ? `background:${c.color};color:${fg(c.color)};border-color:#000;` : ""}">
        <span class="dot" style="background:${S.analysisSelected.has(c.name) ? fg(c.color) : c.color};"></span>${c.name}</div>`).join("")}
    </div>
  </div>`;
}

function wireAnalysisChart() {
  const svg = document.getElementById("analysisChart");
  if (!svg) return;
  const defs = activeAnalysisSeries();
  const seriesData = defs.map((def) => ({ key: def.key, color: def.color, points: trendSeries(def.category, S.analysisRange, S.analysisGranularity) }));
  const points = seriesData[0]?.points ?? [];
  if (points.length === 0) {
    svg.innerHTML = `<text x="173" y="98" text-anchor="middle" style="font:600 12.5px Archivo;fill:rgba(0,0,0,.4)">Nothing to chart yet</text>`;
    return;
  }
  const width = 346, height = 190, padTop = 14, padBottom = 24, padX = 14;
  const max = Math.max(1, ...seriesData.flatMap((s) => s.points.map((p) => p.total)));
  const plotW = width - padX * 2, plotH = height - padTop - padBottom;
  const step = points.length > 1 ? plotW / (points.length - 1) : 0;
  const xAt = (i) => padX + step * i;
  const yAt = (v) => padTop + plotH - (v / max) * plotH;
  const labelEvery = Math.max(1, Math.ceil(points.length / 7));
  const dense = points.length > 30;
  const hover = S.analysisHover;

  let s = `<line x1="${padX}" y1="${padTop+plotH}" x2="${width-padX}" y2="${padTop+plotH}" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>`;
  if (hover !== null) s += `<line x1="${xAt(hover)}" y1="${padTop}" x2="${xAt(hover)}" y2="${padTop+plotH}" stroke="rgba(0,0,0,.28)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  seriesData.forEach((sd) => {
    const d = sd.points.map((p, i) => `${i===0?"M":"L"} ${xAt(i).toFixed(2)} ${yAt(p.total).toFixed(2)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="${sd.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  points.forEach((p, i) => {
    s += `<rect data-i="${i}" x="${xAt(i)-step/2}" y="0" width="${step||plotW}" height="${height}" fill="transparent" style="cursor:pointer" class="hit"/>`;
  });
  seriesData.forEach((sd) => {
    sd.points.forEach((p, i) => {
      const isActive = hover === i;
      if (dense && !isActive) return;
      s += `<circle cx="${xAt(i)}" cy="${yAt(p.total)}" r="${isActive?5.5:3}" fill="${sd.color}" stroke="#000" stroke-width="${isActive?2.5:1.5}" style="pointer-events:none"/>`;
    });
  });
  points.forEach((p, i) => {
    if (i % labelEvery !== 0) return;
    const isActive = hover === i;
    s += `<text x="${xAt(i)}" y="${height-6}" text-anchor="middle" style="font:700 9px 'Space Mono',monospace;letter-spacing:.06em;fill:${isActive?'#000':'rgba(0,0,0,.45)'}">${bucketLabel(p.bucket, S.analysisGranularity).toUpperCase()}</text>`;
  });
  svg.innerHTML = s;
  svg.querySelectorAll(".hit").forEach((el) => {
    el.addEventListener("mouseenter", () => { S.analysisHover = Number(el.dataset.i); render(); });
    el.addEventListener("click", () => { const i = Number(el.dataset.i); S.analysisHover = S.analysisHover === i ? null : i; render(); });
  });
  svg.addEventListener("mouseleave", () => { S.analysisHover = null; render(); });
}

render();
</script>

</body></html>
